<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Bite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="Heading">
            <h1>CampusBite</h1>
            <div class="links">
                <a href="#">Home</a>
                <a href="#">Menu</a>
                <a href="#">Contact Us</a>
            </div>
        </div> 
    </nav>
    <main>
        <div>
            <h3 class="menu">Menu</h3>
        </div>
        <div class="cards">
            <div class="item">
                <img src="Dosa.jpg" alt="" width="100px" height="75px">
                <h3>Masala Dosa</h3>
                <h4>Price : 60rs</h4>
                <p>Crispy dosa with flavorful potato filling.</p>
                <div class="btn">
                    <p>Order Now</p>
                </div>
            </div>
            <div class="item">
                <img src="Coffee.jpg" alt="" width="100px" height="75px">
                <h3>Coffee</h3>
                <h4>Price : 50rs</h4>
                <p>Rich, aromatic, freshly brewed perfection.</p>
                <div class="btn">
                    <p>Order Now</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
